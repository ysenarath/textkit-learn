[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "textkit-learn"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python",
    "Programming Language :: Rust",
    "Typing :: Typed",
]
description = 'Helps computers to understand human languages.'
readme = "README.md"
license = "MIT"
keywords = []
authors = [{ name = "Yasas Senarath" }]
dependencies = [
    "pandas>=0.1,<=2.3.3",
    "polars>=0.8.10,<=1.36.1",
    "numpy>=1.3.0,<=2.3.5",
    "scikit-learn>=1.4.0,<=1.8.0",
    "torch>=2.2.0,<=2.9.1",
    "werkzeug>=0.1,<=3.1.4",
    "pyarrow>=0.9.0,<=22.0.0",
    "transformers>=0.1,<=4.57.3",
    "datasets>=3.0.0,<=3.6.0",
    "evaluate>=0.1.0,<=0.4.6",
    "accelerate>=0.0.1,<=1.12.0",
    "nltk>=2.0.1,<=3.9.2",
    "sortedcontainers>=0.5.0,<=2.4.0",
    "hnswlib>=0.3.2.0,<=0.8.0",
    "flashtext>=1.0,<=2.7",
    "langdetect>=0.1.0,<=1.0.9",
    "nightjar>=0.0.1,<=0.0.5",
    "omegaconf>=1.0.3,<=2.3.0",
    "tabulate>=0.3,<=0.9.0",
    "ipywidgets>=4.0.0,<=8.1.8",
    "seaborn>=0.1,<=0.13.2",
    "adapters>=0.1.0,<=1.2.0",
    "mlflow>=2.20.1,<=2.22.4",
    "gensim>=4.3.3,<=4.4.0",
    "fasttext @ git+https://github.com/facebookresearch/fastText@1142dc4c4ecbc19cc16eee5cdd28472e689267e6",
    "rich>=14.0.0,<=14.2.0",
    "unibreak==0.2.0",
    "duckdb>=1.2.1,<=1.4.3",
    "orjson>=3.10.16,<=3.11.5",
    "sentence-transformers>=0.1.0,<=5.2.0",
    "faiss-cpu==1.10.0",
    "setfit>=1.1.2,<=1.1.3",
    "umap-learn>=0.5.7,<=0.5.9.post2",
    "dill>=0.3.8,<=0.4.0",
    "shap>=0.48.0,<=0.50.0",
    "diskcache==5.6.3",
    "openai>=2.9.0,<=2.11.0",
    "python-dotenv==1.2.1",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/ysenarath/textkit-learn"
Repository = "https://github.com/ysenarath/textkit-learn"
Issues = "https://github.com/ysenarath/textkit-learn/issues"
Changelog = "https://github.com/ysenarath/textkit-learn/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dash = [
    "dash>=3.3.0",
    "dash-bootstrap-components>=2.0.4",
    "dash-cytoscape>=1.0.2",
    "dash-text-components>=0.0.2",
    "flask-caching>=2.3.1",
]

[tool.hatch.version]
path = "src/tklearn/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tklearn"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
extend-include = ["*.ipynb"]
target-version = "py38"
line-length = 79
indent-width = 4
preview = true                                                               # preview features & checks, use with caution
include = ["src/**/*.py", "src/**/*.pyi", "tests/**/*.py", "tests/**/*.pyi"]

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
extend-select = [ # features in preview
    "W292", # missing-newline-at-end-of-file
]
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
    "F601", # dict key literal ... repeated
    "F841", # local variable ... assigned but never used
    # "F821", # undefined name
    "F403", # 'from module import *' used; unable to detect undefined names
    "E402", # module level import not at top of file
]

[tool.ruff.lint.isort]
known-first-party = []

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false
# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.uv.sources]
fasttext = { git = "https://github.com/facebookresearch/fastText", rev = "1142dc4c4ecbc19cc16eee5cdd28472e689267e6" }

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "jupyterlab>=4.4.6",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.22",
    "mkdocstrings>=0.30.1",
    "mkdocstrings-python>=1.18.2",
    "nbconvert>=7.16.6",
    "pydata-sphinx-theme>=0.16.1",
    "ruff>=0.14.9",
    "sphinx>=7.4.7",
    "sphinx-autodoc-typehints>=2.3.0",
]
